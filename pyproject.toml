[project]
name = "tradebot"
version = "0.1.0"
description = "Paper-trading bot with backtesting and risk management (Alpaca)"
requires-python = ">=3.11"
dependencies = ["alpaca-py>=0.30", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
